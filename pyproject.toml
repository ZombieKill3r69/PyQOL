[project]
name = "pyqol"
version = "0.1.0"
description = "A simple python library with things i wish python had"
readme = "README.md"
authors = [
    { name = "me", email = "174894296+ZombieKill3r69@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pyqol = "pyqol:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
